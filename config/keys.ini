; ============================================================
; NeirOS-M — ключи внешних сервисов. СЕКЦИИ РАЗДЕЛЕНЫ ПО КОНТУРАМ.
;
; ВАЖНО: этот файл НЕ должен попадать в систему контроля версий
; (правило config/keys.ini есть в .gitignore). Для настройки заново —
; скопируйте config/keys.example.ini.
;
; КОНТУРЫ (жёстко разделены, утверждено хозяином):
;   [keys_testnet] — ключи биржи-ТЕСТНЕТА (фантики, песочница).
;                     Робота здесь можно гонять в режиме РЕАЛ свободно:
;                     рубильник [trading] live_enabled на него НЕ влияет.
;   [keys_live]    — ключи БОЕВОЙ биржи (деньги). Заполняйте, когда
;                     реально пойдёте в бой; до этого пусто.
;   [keys_news]    — публичные новостные/макро ключи (нетронуты, опасность
;                     нулевая, они не дают доступа к средствам).
;
; Какая биржа используется — решает [trading] contour в config.ini.
; Система НЕ выбирает биржу сама по наличию ключей: contour = testnet
; читает только [keys_testnet], contour = live — только [keys_live].
;
; Формат: ключ = значение (кавычки снимаются автоматически).
; ============================================================

[keys_testnet]
