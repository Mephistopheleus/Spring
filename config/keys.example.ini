; ============================================================
; NeirOS-M — ШАБЛОН ключей внешних сервисов (без секретов).
;
; Скопируйте в config/keys.ini и заполните под себя:
;     copy config\keys.example.ini config\keys.ini
; config/keys.ini в системе контроля версий ИГНОРИРУЕТСЯ.
;
; СЕКЦИИ РАЗДЕЛЕНЫ ПО КОНТУРАМ (жёстко):
;   [keys_testnet] — тестнет (фантики). Здесь робота можно гонять
;                     в режиме РЕАЛ: рубильник live_enabled на него
;                     НЕ влияет — песочница работает свободно.
;   [keys_live]    — боевая биржа (деньги). Пока пусто.
;   [keys_news]    — публичные новостные/макро ключи, безопасно держать.
;
; Какая биржа используется — решает [trading] contour в config.ini.
; contour = testnet читает ТОЛЬКО [keys_testnet], contour = live —
; ТОЛЬКО [keys_live]. Никакого автоматического выбора по наличию ключей.
;
; Рыночные данные Binance (свечи, стакан, ликвидации) ключа НЕ требуют.
; Формат: ключ = значение (кавычки снимаются автоматически).
;
; РЕАЛ включается ручками в config.ini:
;   [trading] contour = testnet|live|shadow — выбор биржи;
;   [trading] testnet_mode = real|shadow|lab — режим тестнета;
;   [trading] live_mode    = real|shadow|lab — режим боевой;
;   [trading] live_enabled = true|false — рубильник ТОЛЬКО боевого контура.
; ============================================================

[keys_testnet]
; Ключи ФЬЮЧЕРСНОГО тестнета (testnet.binancefuture.com, кнопка HMAC).
; Спотовый тестнет (binance.vision) не подходит!
api_key =
api_secret =

[keys_live]
; Ключи БОЕВОЙ биржи (fapi.binance.com). Пока пусто — contour = live
; переведёт систему в тень автоматически (деньги не сдвинутся).
; Храните ключи ТОЛЬКО для чтения/торговли, без вывода средств:
; ключ с правом вывода — лишний риск при утечке.
api_key =
api_secret =

[keys_news]
; Ключи проекта (бесплатные тарифы) — доступа к средствам не имеют.
newsapi_key =
finnhub_key =
fred_api_key =