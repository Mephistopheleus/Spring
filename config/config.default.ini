cascade_bend_min = 1.0
cascade_step_atr = 0.6

# ВЕСА ПСИХОЗА СРЕДЫ (утверждено): три поля плотности/хаоса/жадности рынка.
# Старт 0.0 — Тюнер выводит их из нуля по фактам чистой пользы. Вилки узкие:
# это параметры СРЕДЫ, а не направления; их роль — в координатах входа и
# ширине облака шума, а не в выборе стороны.
