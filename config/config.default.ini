# ВЕСА РЕГРЕССИИ ПОСЛОЙНОЙ (утверждено): по 5 на каждый уровень (1м/64м) —
# оценка, скорость, УСКОРЕНИЕ, затухание, срок жизни. Ускорение и затухание
# Регрессия считала всегда, в вектор они не попадали — Тюнер на них не мог
# учиться. Вилка ускорения узкая: вторая производная зашумлена.
