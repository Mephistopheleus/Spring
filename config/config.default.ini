health_interval = 30
init_timeout = 30
stop_timeout = 10
tick_timeout = 10
envelope_alarm_sec = 15
# ЛИЧНЫЕ КОНВЕРТЫ, ЖДУЩИЕ ЯЩИК (P0, аудит 01.10): адресат может не открыть
# ящик при старте — команда (например «закрыть») ждёт в очереди, а не
# теряется молча. Проверено: tests/smoke_stage36.py
envelope_defer_max = 200
envelope_defer_ttl_sec = 300
max_trades = 20000

[market]
symbol = DOGEUSDT
base_tf_sec = 60
# ПОВЕРХНОСТЬ = ТОЛЬКО БИРЖЕВАЯ ПАЛИТРА (ТЗ хозяина). senior_tf_sec —
# список НАШИХ не-биржевых ступеней (синтез из минуток). ПО УМОЛЧАНИЮ
# ПУСТО: предзагружаются только волокна биржи — 3m/5m/15m/30m/1h/2h/
# 4h/6h/8h/12h/1d/3d из EXCHANGE_SPECTRUM, якоря с биржи, рост синтезом.
# Любое другое волокно (например 2м или 64м) достраивается ЛЕНИВО по
# запросу анализатора (Collector.get_ring) из ближайшего мельче,
# делящего нацело. Хотим постоянную ступень — впишем её сюда в секундах.
senior_tf_sec =
pyramid_depth = 300
archive_tf_sec = 900, 3600, 14400
history_limit = 10080
rest_limit = 1500
rest_pages = 8
senior_rest_limit = 300
min_senior_history = 200
# ЯКОРЯ С БИРЖИ (27.10): по 60 свечей на каждый ТФ биржевого спектра.
# Нужны прежде всего для 1d/3d — их синтезом из минуток не набрать в
# принципе (сутки непрерывной работы на одно суточное кольцо).
# 60 свечей = 5 часов на 5m и 180 суток на 3d.
anchor_bars = 60

[lenses]
# Лестница масштабов (полураспад, мин): плотная у низа (точность входа),
# разряжается кверху. 0.5 = 30с — прогревается с живого потока (минутной
# свечей не взять). Меняем одной строкой — тензор SURFACE берёт отсюда
# длину и шкалу.
scales_min = 0.5, 0.71, 1, 1.41, 2, 3, 4, 5, 5.66, 8, 11.3, 15, 22.6, 30, 45.3, 60, 90.5, 120, 181, 240, 360, 480, 720, 1024, 1440, 2048, 2896, 4320, 5793, 8192, 10080
# РУЧКА ТОЧНОСТИ (12.10.2026): множитель полураспада каждой линзы.
# Полураспад линзы = масштаб (мин × 60 сек) × half_life_factor.
# 1.0 — по умолчанию (полураспад = масштабу, как в учебнике EWMA);
# <1 — резче и шумнее, >1 — плавнее, но с отставанием. Ведёт Тюнер (0.5..2.0).
