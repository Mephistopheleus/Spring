# модуль не поднимается. Нет ключа или не false - поднимается как обычно.
# Нужно, чтобы убрать недоделанный модуль, не вырезая класс из кода.
neuro-predictor = false      # прогнозы без проверки (labeled=0): калибровать
                             # остальных анализаторов на таком шуме нельзя
[storage]
db_path = data/neiros.db
db_max_mb = 200
# Тик-архив сырых сделок УДАЛЁН 27.10 (потребителей не было, объём
# 150–190 МБ/сутки). Подминутная точность — секундные бары OHLCV.
# ВИДЫ КАРТОЧЕК, НЕ ПИШУЩИЕСЯ В ЖУРНАЛ (хозяин, 19.10): рутинные снимки
# среды (flow-state — штамп раз в минуту) архив не растят: прогреву матрицы
# они не нужны (первая карточка придёт через минуту после старта), учёба
# Тюнера живёт в векторе сценария. Нужен разбор «что видела система» —
# убрать вид из списка (пусто = пишется всё), журнал включится.
# Барьеры и дивергенции (редкие события) пишутся всегда.
skip_card_kinds = flow-state

[matrix]
