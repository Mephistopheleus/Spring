fee_pct = 0.05
# ===================== КОНТУРЫ (строго два) =====================
# КОНТУР: какая биржа используется. Система НЕ выбирает биржу сама по
# наличию ключей — contour читает ТОЛЬКО свою секцию в keys.ini:
#   testnet → [keys_testnet] (testnet.binancefuture.com, фантики)
#   live    → [keys_live]    (fapi.binance.com, ДЕНЬГИ)
# Третьих состояний нет (прежний contour = shadow убран).
contour = testnet
# РЕЖИМ ИСПОЛНЕНИЯ внутри контура (ровно два):
#   real   — ордер идёт на биржу этого контура (в testnet — фантики)
#   shadow — сделка считается максимально близко к реальной, но ордер
#            НЕ открывается
testnet_mode = real
live_mode = shadow
# РУБИЛЬНИК: отвечает ТОЛЬКО за LIVE-контур (деньги). На testnet-реал
# (тестирование робота на фантиках) НЕ влияет — иначе песочница была бы
# заблокирована. Страховка от случайного боевого прогона.
live_enabled = false

[scenario]
min_net_move_pct = 0.35
# ФИЛЬТР ХОДА (утверждено): чистый ход = издержки × запас. 0.35% (пол)
# резало 98% путей; запас x1.4 — деньги на окупаемых путях (ручка)
