route_max_dist_pct = 0.9
# ВЕСА НАПРАВЛЕНИЯ (аудит 27.09): вынесены из кода в конфиг и
# расставлены по замерам истории (884 сц., база: падение 60%).
# magnet_weight  — тяга зон (по расстоянию, честный голос);
# news_weight    — настроение новостей (лучший факт после тренда);
# fuel_weight    — топливо потока (информации почти нет — тихий);
# trend_weight   — живая карточка тренда (100% точность, редкость);
# tape_speed_weight — скорость ленты: сторону ищет Тюнер по полезности
#                     (ручных знаков нет — механизм разворачивает сам);
# magnets_dist_k — полураспад голоса зоны по расстоянию, в ATR.
magnet_weight = 0.5
news_weight = 0.3
fuel_weight = 0.1
trend_weight = 0.2
tape_speed_weight = 0
magnets_dist_k = 4.0

